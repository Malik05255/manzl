name = "h-ai-smart-media-orchestrator"
main = "src/index-v4.ts"
compatibility_date = "2026-09-08"

[observability]
enabled = true

[triggers]
crons = ["17 3 * * *"]

[[workflows]]
name = "h-ai-smart-media-v1"
binding = "SMART_MEDIA_WORKFLOW"
class_name = "SmartMediaWorkflow"

[[r2_buckets]]
binding = "MOVIES"
bucket_name = "h-ai-movies"

[vars]
SUPABASE_URL = "https://abavsspydbpkudhswmzp.supabase.co"
PUBLIC_BASE_URL = ""

# Required Worker secrets before deployment:
# - GROQ_API_KEY
# - SUPABASE_SERVICE_ROLE_KEY
# - ORCHESTRATOR_TOKEN
#
# Recommended for large direct movie URLs up to 2 GB:
# - GEMINI_API_KEY
#
# Optional highest-quality route for movies larger than the direct provider limits:
# - AUDIO_EXTRACTOR_URL
# - AUDIO_EXTRACTOR_TOKEN
#
# Optional translation fallback:
# - AZURE_TRANSLATOR_KEY
# - AZURE_TRANSLATOR_REGION
# - AZURE_TRANSLATOR_ENDPOINT
#
# The 03:17 UTC daily cron removes expired R2 movie objects under ttl/*.
# Translation/SRT/summary data stays in Supabase unless the user deletes it separately.

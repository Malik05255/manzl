name: Debug build APK

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon :translator-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: movie-translator-debug
          path: translator-app/build/outputs/apk/debug/translator-app-debug.apk

name: Generate Release Version

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build release APK and bundle
        run: ./gradlew --no-daemon :translator-app:assembleRelease :translator-app:bundleRelease
      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: movie-translator-release-${{ github.ref_name }}
          path: |
            translator-app/build/outputs/apk/release/*.apk
            translator-app/build/outputs/bundle/release/*.aab

name: Smart Media DEV Deploy

on:
  push:
    branches:
      - development-smart-media-v1
    paths:
      - 'cloudflare/smart-media-orchestrator/**'
      - 'cloudflare/media-ingest/**'
      - '.github/workflows/smart-media-dev-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-cloudflare-dev:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Require Cloudflare development credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }

      - name: Ensure R2 movie bucket exists
        shell: bash
        run: npx --yes wrangler@latest r2 bucket create h-ai-movies || true

      - name: Deploy durable Smart Media orchestrator
        working-directory: cloudflare/smart-media-orchestrator
        run: npx --yes wrangler@latest deploy

      - name: Deploy optional media ingest worker
        working-directory: cloudflare/media-ingest
        run: npx --yes wrangler@latest deploy

name: Android CI

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build standalone app
        run: ./gradlew --no-daemon :translator-app:assembleDebug :translator-app:testDebugUnitTest :translator-app:lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movie-translator-debug
          path: translator-app/build/outputs/apk/debug/translator-app-debug.apk

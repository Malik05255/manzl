name: Android CI

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # Main-branch APKs keep one signing identity across CI runs. This allows future APKs to update
      # in place and keeps Android's app-scoped device identity stable across uninstall/reinstall.
      - name: Restore stable app signing identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: manzl-android-debug-keystore-v1

      - name: Create stable app signing identity on first run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=Manzl Movie Translator,OU=Personal Android,O=Manzl,L=Riyadh,ST=Riyadh,C=SA"
          fi

      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build standalone app
        run: ./gradlew --no-daemon :translator-app:assembleDebug :translator-app:testDebugUnitTest :translator-app:lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movie-translator-debug
          path: translator-app/build/outputs/apk/debug/translator-app-debug.apk

name: Cloudflare Movie Workflow

on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/movie-workflow/**"
      - ".github/workflows/cloudflare-movie-workflow.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check Cloudflare deployment credentials
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOVIE_AUDIO_EXTRACTOR_TOKEN: ${{ secrets.MOVIE_AUDIO_EXTRACTOR_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$MOVIE_AUDIO_EXTRACTOR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: required repository secrets are not configured."
          fi

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/movie-workflow/package.json

      - name: Install Wrangler
        if: steps.preflight.outputs.enabled == 'true'
        working-directory: cloudflare/movie-workflow
        run: npm install --no-audit --no-fund

      - name: Ensure private R2 bucket exists
        if: steps.preflight.outputs.enabled == 'true'
        working-directory: cloudflare/movie-workflow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create manzl-movie-audio || true

      - name: Deploy Worker and Workflow
        if: steps.preflight.outputs.enabled == 'true'
        working-directory: cloudflare/movie-workflow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Install shared service token
        if: steps.preflight.outputs.enabled == 'true'
        working-directory: cloudflare/movie-workflow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOVIE_AUDIO_EXTRACTOR_TOKEN: ${{ secrets.MOVIE_AUDIO_EXTRACTOR_TOKEN }}
        run: printf '%s' "$MOVIE_AUDIO_EXTRACTOR_TOKEN" | npx wrangler secret put AUDIO_EXTRACTOR_TOKEN
